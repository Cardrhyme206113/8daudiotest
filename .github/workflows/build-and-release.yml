name: Build and release Orbit8D Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ORBIT8D_KEYSTORE_B64 != '' && secrets.ORBIT8D_KEY_PASSWORD != '' }}
      ORBIT8D_VERSION_CODE: ${{ github.run_number }}
      ORBIT8D_VERSION_NAME: 0.2.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode project source
        run: |
          cat bundle/part*.b64 > Orbit8D-Android.zip.b64.joined
          base64 -d Orbit8D-Android.zip.b64.joined > Orbit8D-Android.zip
          echo 'bdcf54d67631a8e4d7b2a7cc6f5729e9f08681405ac8415e231dca278887a15a  Orbit8D-Android.zip' | sha256sum -c -
          unzip -q Orbit8D-Android.zip
          cp patches/app-build.gradle Orbit8D-Android/app/build.gradle
          cp patches/ModelManager.java Orbit8D-Android/app/src/main/java/com/orbit8d/app/ModelManager.java

      - name: Validate lightweight Demucs model contract
        if: github.event_name == 'pull_request'
        run: |
          MODEL_URL='https://huggingface.co/Joker5514/VoiceIsolate-Models/resolve/main/demucs_v4_quantized.onnx?download=true'
          curl -L --fail --retry 3 --retry-delay 2 "$MODEL_URL" -o /tmp/demucs_v4_quantized.onnx
          echo "MODEL_BYTES=$(stat -c%s /tmp/demucs_v4_quantized.onnx)"
          echo "MODEL_SHA256=$(sha256sum /tmp/demucs_v4_quantized.onnx | cut -d' ' -f1)"
          python3 -m pip install --quiet 'onnx>=1.17,<2'
          python3 - <<'PY'
          import onnx
          from onnx import TensorProto
          p='/tmp/demucs_v4_quantized.onnx'
          m=onnx.load(p, load_external_data=False)
          def dims(v):
              t=v.type.tensor_type
              out=[]
              for d in t.shape.dim:
                  out.append(d.dim_value if d.HasField('dim_value') else (d.dim_param or '?'))
              return out
          print('MODEL_IR', m.ir_version, 'OPSET', [(x.domain,x.version) for x in m.opset_import])
          print('INPUTS', [(v.name,dims(v),TensorProto.DataType.Name(v.type.tensor_type.elem_type)) for v in m.graph.input])
          print('OUTPUTS', [(v.name,dims(v),TensorProto.DataType.Name(v.type.tensor_type.elem_type)) for v in m.graph.output])
          for init in m.graph.initializer[:5]:
              print('INIT', init.name, list(init.dims), TensorProto.DataType.Name(init.data_type))
          PY
          echo '--- Android inference code references ---'
          grep -RniE 'OrtSession|session\.run|getInputNames|getOutputNames|343980|drums|bass|vocals|other' Orbit8D-Android/app/src/main/java/com/orbit8d/app || true

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare permanent release key
        if: github.event_name != 'pull_request' && env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ORBIT8D_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ORBIT8D_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64, hashlib
          from pathlib import Path
          raw = os.environ['KEYSTORE_B64'].strip()
          if raw.startswith('ORBIT8D_KEYSTORE_B64='):
              raw = raw.split('=', 1)[1]
          raw = ''.join(raw.split())
          data = base64.b64decode(raw, validate=True)
          expected = 'd4c5c0b53f63dd110d20be8db1843b7429e03763e0529572c772db68a603dad6'
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Permanent Orbit8D keystore does not match the expected signing key.')
          (Path(os.environ['RUNNER_TEMP']) / 'orbit8d-release.jks').write_bytes(data)
          print('Permanent Orbit8D signing key verified.')
          PY
          chmod 600 "$RUNNER_TEMP/orbit8d-release.jks"
          KEY_PASSWORD="${KEY_PASSWORD#ORBIT8D_KEY_PASSWORD=}"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          EXPECTED_PASS_HASH='f98afd9397e1a64e021540096c506db018a40bd3ce6dcb1d228e799beb226ac2'
          GOT_PASS_HASH="$(printf '%s' "$KEY_PASSWORD" | sha256sum | cut -d' ' -f1)"
          [[ "$GOT_PASS_HASH" == "$EXPECTED_PASS_HASH" ]] || { echo 'Permanent signing password mismatch.'; exit 21; }
          keytool -list -keystore "$RUNNER_TEMP/orbit8d-release.jks" -storepass "$KEY_PASSWORD" -alias orbit8d >/dev/null
          echo "ORBIT8D_RESOLVED_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo 'ORBIT8D_RESOLVED_ALIAS=orbit8d' >> "$GITHUB_ENV"

      - name: Build debug validation APK
        if: github.event_name == 'pull_request' || env.HAS_SIGNING != 'true'
        working-directory: Orbit8D-Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Build signed updateable APK
        if: github.event_name != 'pull_request' && env.HAS_SIGNING == 'true'
        working-directory: Orbit8D-Android
        run: |
          export ORBIT8D_KEYSTORE_PATH="$RUNNER_TEMP/orbit8d-release.jks"
          export ORBIT8D_KEYSTORE_PASSWORD="$ORBIT8D_RESOLVED_PASSWORD"
          export ORBIT8D_KEY_ALIAS="$ORBIT8D_RESOLVED_ALIAS"
          export ORBIT8D_KEY_PASSWORD="$ORBIT8D_RESOLVED_PASSWORD"
          gradle :app:assembleRelease --stacktrace

      - name: Verify release signature
        if: github.event_name != 'pull_request' && env.HAS_SIGNING == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs Orbit8D-Android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK artifact
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" && "$HAS_SIGNING" == "true" ]]; then
            cp Orbit8D-Android/app/build/outputs/apk/release/app-release.apk "Orbit8D-v${ORBIT8D_VERSION_NAME}.apk"
          else
            cp Orbit8D-Android/app/build/outputs/apk/debug/app-debug.apk "Orbit8D-v${ORBIT8D_VERSION_NAME}-dev.apk"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbit8D-v${{ env.ORBIT8D_VERSION_NAME }}
          path: Orbit8D-v*.apk

      - name: Create GitHub Release with signed APK
        if: github.event_name != 'pull_request' && env.HAS_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ env.ORBIT8D_VERSION_NAME }}
        run: |
          gh release create "$TAG" \
            "Orbit8D-v${ORBIT8D_VERSION_NAME}.apk" \
            --target "${GITHUB_SHA}" \
            --title "Orbit8D Android ${TAG}" \
            --notes "Orbit8D Android with the lightweight quantized Demucs v4 ONNX separator (~83 MB download instead of ~166 MB). Signed with the same permanent release key and package ID, so this installs as an in-place update. The downloaded model stays in app-private storage across future updates."

      - name: Explain missing signing secrets
        if: github.event_name != 'pull_request' && env.HAS_SIGNING != 'true'
        run: |
          echo 'Signing secrets are unavailable; refusing to publish a debug-signed public release.'
          exit 1
