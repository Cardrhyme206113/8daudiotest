name: Build and release Orbit8D Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ORBIT8D_KEYSTORE_B64 != '' && secrets.ORBIT8D_KEY_PASSWORD != '' }}
      ORBIT8D_VERSION_CODE: ${{ github.run_number }}
      ORBIT8D_VERSION_NAME: 0.3.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode and patch project source
        run: |
          cat bundle/part*.b64 > Orbit8D-Android.zip.b64.joined
          base64 -d Orbit8D-Android.zip.b64.joined > Orbit8D-Android.zip
          echo 'bdcf54d67631a8e4d7b2a7cc6f5729e9f08681405ac8415e231dca278887a15a  Orbit8D-Android.zip' | sha256sum -c -
          unzip -q Orbit8D-Android.zip
          cp patches/app-build.gradle Orbit8D-Android/app/build.gradle
          cp patches/ModelManager.java Orbit8D-Android/app/src/main/java/com/orbit8d/app/ModelManager.java
          cp patches/DemucsSeparator.java Orbit8D-Android/app/src/main/java/com/orbit8d/app/DemucsSeparator.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Orbit8D-Android/app/src/main/java/com/orbit8d/app/MainActivity.java')
          s = p.read_text()
          s = s.replace(
              'String[] providers = {"XNNPACK · recommended", "NNAPI · experimental", "CPU · fallback"};',
              'String[] providers = {"NPU (NNAPI) · recommended", "XNNPACK · fallback", "CPU · fallback"};'
          )
          s = s.replace(
              'if (pos == 1) return DemucsSeparator.Provider.NNAPI;\n        if (pos == 2) return DemucsSeparator.Provider.CPU;\n        return DemucsSeparator.Provider.XNNPACK;',
              'if (pos == 0) return DemucsSeparator.Provider.NNAPI;\n        if (pos == 1) return DemucsSeparator.Provider.XNNPACK;\n        return DemucsSeparator.Provider.CPU;'
          )
          s = s.replace(
              '"HTDemucs 4-stem fp16-weight ONNX · %.1f MB on disk · XNNPACK recommended",\n                f.length() / 1048576.0',
              '"Spleeter 4-stem fp16 · %.1f MB on disk · NPU/NNAPI preferred",\n                ModelManager.totalBytes(this) / 1048576.0'
          )
          s = s.replace(
              '"Out of memory while loading Demucs. Close other apps or try CPU/XNNPACK after restarting Orbit8D."',
              '"Separator ran out of memory. Try XNNPACK or CPU after restarting Orbit8D."'
          )
          s = s.replace('"Download/import the ONNX model first"', '"Download the Lite model pack first"')
          s = s.replace(
              'bindViews();\n        setupProviderSpinner();',
              'bindViews();\n        importModel.setVisibility(View.GONE);\n        setupProviderSpinner();'
          )
          p.write_text(s)
          PY

          python3 patches/patch_spatial_v03.py
          python3 patches/patch_focus_depth_v031.py

          grep -q 'NPU (NNAPI) · recommended' Orbit8D-Android/app/src/main/java/com/orbit8d/app/MainActivity.java
          grep -q 'Spleeter 4-stem fp16' Orbit8D-Android/app/src/main/java/com/orbit8d/app/MainActivity.java
          grep -q 'NNAPIFlags.CPU_DISABLED' Orbit8D-Android/app/src/main/java/com/orbit8d/app/DemucsSeparator.java
          grep -q 'manualGainPercent' Orbit8D-Android/app/src/main/java/com/orbit8d/app/Choreography.java
          grep -q 'elevationDeg' Orbit8D-Android/app/src/main/java/com/orbit8d/app/Choreography.java
          grep -q 'Damped feedback room' Orbit8D-Android/app/src/main/java/com/orbit8d/app/SpatialRenderer.java
          grep -q 'Drums manual' Orbit8D-Android/app/src/main/java/com/orbit8d/app/MainActivity.java
          grep -q 'tripleThrow' Orbit8D-Android/app/src/main/java/com/orbit8d/app/Choreography.java
          grep -q '1.25); // focus stem may travel beyond' Orbit8D-Android/app/src/main/java/com/orbit8d/app/SpatialRenderer.java

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare permanent release key
        if: github.event_name != 'pull_request' && env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ORBIT8D_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.ORBIT8D_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64, hashlib
          from pathlib import Path
          raw = os.environ['KEYSTORE_B64'].strip()
          if raw.startswith('ORBIT8D_KEYSTORE_B64='):
              raw = raw.split('=', 1)[1]
          raw = ''.join(raw.split())
          data = base64.b64decode(raw, validate=True)
          expected = 'd4c5c0b53f63dd110d20be8db1843b7429e03763e0529572c772db68a603dad6'
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Permanent Orbit8D keystore does not match the expected signing key.')
          (Path(os.environ['RUNNER_TEMP']) / 'orbit8d-release.jks').write_bytes(data)
          print('Permanent Orbit8D signing key verified.')
          PY
          chmod 600 "$RUNNER_TEMP/orbit8d-release.jks"
          KEY_PASSWORD="${KEY_PASSWORD#ORBIT8D_KEY_PASSWORD=}"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          EXPECTED_PASS_HASH='f98afd9397e1a64e021540096c506db018a40bd3ce6dcb1d228e799beb226ac2'
          GOT_PASS_HASH="$(printf '%s' "$KEY_PASSWORD" | sha256sum | cut -d' ' -f1)"
          [[ "$GOT_PASS_HASH" == "$EXPECTED_PASS_HASH" ]] || { echo 'Permanent signing password mismatch.'; exit 21; }
          keytool -list -keystore "$RUNNER_TEMP/orbit8d-release.jks" -storepass "$KEY_PASSWORD" -alias orbit8d >/dev/null
          echo "ORBIT8D_RESOLVED_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo 'ORBIT8D_RESOLVED_ALIAS=orbit8d' >> "$GITHUB_ENV"

      - name: Build debug validation APK
        if: github.event_name == 'pull_request' || env.HAS_SIGNING != 'true'
        working-directory: Orbit8D-Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Build signed updateable APK
        if: github.event_name != 'pull_request' && env.HAS_SIGNING == 'true'
        working-directory: Orbit8D-Android
        run: |
          export ORBIT8D_KEYSTORE_PATH="$RUNNER_TEMP/orbit8d-release.jks"
          export ORBIT8D_KEYSTORE_PASSWORD="$ORBIT8D_RESOLVED_PASSWORD"
          export ORBIT8D_KEY_ALIAS="$ORBIT8D_RESOLVED_ALIAS"
          export ORBIT8D_KEY_PASSWORD="$ORBIT8D_RESOLVED_PASSWORD"
          gradle :app:assembleRelease --stacktrace

      - name: Verify release signature
        if: github.event_name != 'pull_request' && env.HAS_SIGNING == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs Orbit8D-Android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK artifact
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" && "$HAS_SIGNING" == "true" ]]; then
            cp Orbit8D-Android/app/build/outputs/apk/release/app-release.apk "Orbit8D-v${ORBIT8D_VERSION_NAME}.apk"
          else
            cp Orbit8D-Android/app/build/outputs/apk/debug/app-debug.apk "Orbit8D-v${ORBIT8D_VERSION_NAME}-dev.apk"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbit8D-v${{ env.ORBIT8D_VERSION_NAME }}
          path: Orbit8D-v*.apk

      - name: Create GitHub Release with signed APK
        if: github.event_name != 'pull_request' && env.HAS_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ env.ORBIT8D_VERSION_NAME }}
        run: |
          gh release create "$TAG" \
            "Orbit8D-v${ORBIT8D_VERSION_NAME}.apk" \
            --target "${GITHUB_SHA}" \
            --title "Orbit8D Android ${TAG}" \
            --notes "Orbit8D 3D Spatial: the currently featured/moving stem now makes an exaggerated ~3x near/far excursion, can travel slightly beyond the visual room ring, stays far through most of its movement, then returns to its expected listener distance during roughly the final second. Other stems retain their previous depth behavior. Existing elevation, side clarity, damped late reverb, manual 0–200% stem overrides, Spleeter fp16 ONNX pack and NPU-first NNAPI inference remain unchanged."

      - name: Explain missing signing secrets
        if: github.event_name != 'pull_request' && env.HAS_SIGNING != 'true'
        run: |
          echo 'Signing secrets are unavailable; refusing to publish a debug-signed public release.'
          exit 1
