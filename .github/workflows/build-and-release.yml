name: Build and release Orbit8D Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode project source
        run: |
          base64 -d Orbit8D-Android.zip.b64 > Orbit8D-Android.zip
          unzip -q Orbit8D-Android.zip

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build installable APK
        working-directory: Orbit8D-Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release APK
        run: |
          cp Orbit8D-Android/app/build/outputs/apk/debug/app-debug.apk Orbit8D-v0.1.0-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbit8D-v0.1.0-debug
          path: Orbit8D-v0.1.0-debug.apk

      - name: Create/update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "${GITHUB_SHA}" --title "Orbit8D Android v0.1.0" --notes "First Android build of Orbit8D. Uses the 4-stem HTDemucs ONNX pipeline and the current section-aware orbit choreography. This APK is debug-signed so it can be installed directly."
          fi
          gh release upload "$TAG" Orbit8D-v0.1.0-debug.apk --clobber
