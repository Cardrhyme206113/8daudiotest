name: Build and release Orbit8D Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ORBIT8D_KEYSTORE_B64 != '' && secrets.ORBIT8D_KEYSTORE_PASSWORD != '' && secrets.ORBIT8D_KEY_PASSWORD != '' }}
      ORBIT8D_VERSION_CODE: ${{ github.run_number }}
      ORBIT8D_VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode project source
        run: |
          cat bundle/part*.b64 > Orbit8D-Android.zip.b64.joined
          base64 -d Orbit8D-Android.zip.b64.joined > Orbit8D-Android.zip
          echo 'bdcf54d67631a8e4d7b2a7cc6f5729e9f08681405ac8415e231dca278887a15a  Orbit8D-Android.zip' | sha256sum -c -
          unzip -q Orbit8D-Android.zip
          cp patches/app-build.gradle Orbit8D-Android/app/build.gradle
          cp patches/ModelManager.java Orbit8D-Android/app/src/main/java/com/orbit8d/app/ModelManager.java

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare persistent release key
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ORBIT8D_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ORBIT8D_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ORBIT8D_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64, hashlib
          from pathlib import Path
          raw = os.environ['KEYSTORE_B64'].strip()
          if raw.startswith('ORBIT8D_KEYSTORE_B64='):
              raw = raw.split('=', 1)[1]
          raw = ''.join(raw.split())
          data = base64.b64decode(raw, validate=True)
          path = Path(os.environ['RUNNER_TEMP']) / 'orbit8d-release.jks'
          path.write_bytes(data)
          got = hashlib.sha256(data).hexdigest()
          expected = 'd4c5c0b53f63dd110d20be8db1843b7429e03763e0529572c772db68a603dad6'
          if got != expected:
              raise SystemExit('KEYSTORE_CONTENT_MISMATCH')
          print('Keystore bytes match the permanent Orbit8D signing key.')
          PY
          chmod 600 "$RUNNER_TEMP/orbit8d-release.jks"

          clean_secret() {
            local value="$1" prefix="$2"
            value="${value#$prefix=}"
            value="$(printf '%s' "$value" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            printf '%s' "$value"
          }
          STORE_PASSWORD="$(clean_secret "$STORE_PASSWORD" ORBIT8D_KEYSTORE_PASSWORD)"
          KEY_PASSWORD="$(clean_secret "$KEY_PASSWORD" ORBIT8D_KEY_PASSWORD)"

          EXPECTED_PASS_HASH='f98afd9397e1a64e021540096c506db018a40bd3ce6dcb1d228e799beb226ac2'
          STORE_HASH="$(printf '%s' "$STORE_PASSWORD" | sha256sum | cut -d' ' -f1)"
          KEY_HASH="$(printf '%s' "$KEY_PASSWORD" | sha256sum | cut -d' ' -f1)"

          if [[ "$STORE_HASH" == "$EXPECTED_PASS_HASH" ]]; then
            RESOLVED_PASSWORD="$STORE_PASSWORD"
            echo 'Repository keystore-password secret matches.'
          elif [[ "$KEY_HASH" == "$EXPECTED_PASS_HASH" ]]; then
            RESOLVED_PASSWORD="$KEY_PASSWORD"
            echo 'Key-password secret matches; using it for both keystore and key (the permanent JKS uses the same password for both).'
          else
            echo 'BOTH_PASSWORD_SECRETS_MISMATCH'
            exit 21
          fi

          keytool -list -keystore "$RUNNER_TEMP/orbit8d-release.jks" -storepass "$RESOLVED_PASSWORD" -alias orbit8d >/dev/null
          echo 'Keystore password and orbit8d alias verified.'
          echo "ORBIT8D_RESOLVED_PASSWORD=$RESOLVED_PASSWORD" >> "$GITHUB_ENV"
          echo 'ORBIT8D_RESOLVED_ALIAS=orbit8d' >> "$GITHUB_ENV"

      - name: Build debug validation APK
        if: env.HAS_SIGNING != 'true'
        working-directory: Orbit8D-Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Build signed updateable APK
        if: env.HAS_SIGNING == 'true'
        working-directory: Orbit8D-Android
        run: |
          export ORBIT8D_KEYSTORE_PATH="$RUNNER_TEMP/orbit8d-release.jks"
          export ORBIT8D_KEYSTORE_PASSWORD="$ORBIT8D_RESOLVED_PASSWORD"
          export ORBIT8D_KEY_ALIAS="$ORBIT8D_RESOLVED_ALIAS"
          export ORBIT8D_KEY_PASSWORD="$ORBIT8D_RESOLVED_PASSWORD"
          gradle :app:assembleRelease --stacktrace

      - name: Verify release signature
        if: env.HAS_SIGNING == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs Orbit8D-Android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK artifact
        run: |
          if [[ "$HAS_SIGNING" == "true" ]]; then
            cp Orbit8D-Android/app/build/outputs/apk/release/app-release.apk "Orbit8D-v${ORBIT8D_VERSION_NAME}.apk"
          else
            cp Orbit8D-Android/app/build/outputs/apk/debug/app-debug.apk "Orbit8D-v${ORBIT8D_VERSION_NAME}-dev.apk"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbit8D-v${{ env.ORBIT8D_VERSION_NAME }}
          path: Orbit8D-v*.apk

      - name: PR validation only
        if: github.event_name == 'pull_request' && env.HAS_SIGNING == 'true'
        run: echo 'Signed APK validated. Official GitHub Release will be produced from main.'

      - name: Create GitHub Release with signed APK
        if: github.event_name != 'pull_request' && env.HAS_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ env.ORBIT8D_VERSION_NAME }}
        run: |
          gh release create "$TAG" \
            "Orbit8D-v${ORBIT8D_VERSION_NAME}.apk" \
            --target "$GITHUB_SHA" \
            --title "Orbit8D Android ${TAG}" \
            --notes "Signed updateable Orbit8D Android build. Future releases use the same package and persistent signing key, so Android accepts them as updates and the downloaded HTDemucs ONNX model remains in app-private storage across normal APK updates."

      - name: Explain missing signing secrets
        if: env.HAS_SIGNING != 'true'
        run: |
          echo 'No signed Release was created because one or more Orbit8D signing secrets are unavailable to this workflow.'
          exit 1
