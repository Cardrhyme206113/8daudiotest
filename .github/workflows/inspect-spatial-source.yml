name: Inspect Orbit8D spatial source

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode project
        run: |
          cat bundle/part*.b64 > Orbit8D-Android.zip.b64.joined
          base64 -d Orbit8D-Android.zip.b64.joined > Orbit8D-Android.zip
          unzip -q Orbit8D-Android.zip
      - name: Print relevant source
        run: |
          set -e
          for f in \
            Orbit8D-Android/app/src/main/java/com/orbit8d/app/SpatialRenderer.java \
            Orbit8D-Android/app/src/main/java/com/orbit8d/app/Choreography.java \
            Orbit8D-Android/app/src/main/java/com/orbit8d/app/MainActivity.java \
            Orbit8D-Android/app/src/main/res/layout/activity_main.xml; do
            echo "===== FILE: $f ====="
            cat "$f"
            echo
          done
