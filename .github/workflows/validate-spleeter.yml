name: Validate Spleeter 4-stem ONNX pack

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect four fp16 models
        run: |
          set -euxo pipefail
          mkdir -p /tmp/spleeter
          for stem in vocals drums bass other; do
            url="https://huggingface.co/Best-Practice/spleeter-4stems-onnx/resolve/main/${stem}.fp16.onnx"
            curl -L --fail --retry 3 --retry-delay 2 "$url" -o "/tmp/spleeter/${stem}.fp16.onnx"
            printf '%s bytes=' "$stem"; stat -c%s "/tmp/spleeter/${stem}.fp16.onnx"
            sha256sum "/tmp/spleeter/${stem}.fp16.onnx"
          done
          python3 -m pip install --quiet 'onnx>=1.17,<2'
          python3 - <<'PY'
          import onnx, glob, os
          from onnx import TensorProto
          def dims(v):
              out=[]
              for d in v.type.tensor_type.shape.dim:
                  out.append(d.dim_value if d.HasField('dim_value') else (d.dim_param or '?'))
              return out
          for p in sorted(glob.glob('/tmp/spleeter/*.onnx')):
              m=onnx.load(p, load_external_data=False)
              print('FILE',os.path.basename(p),'IR',m.ir_version,'OPSET',[(x.domain,x.version) for x in m.opset_import])
              print('INPUTS',[(v.name,dims(v),TensorProto.DataType.Name(v.type.tensor_type.elem_type)) for v in m.graph.input])
              print('OUTPUTS',[(v.name,dims(v),TensorProto.DataType.Name(v.type.tensor_type.elem_type)) for v in m.graph.output])
          PY
